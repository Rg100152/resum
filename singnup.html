<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Create Your RESUM Account</title>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --secondary: #06b6d4;
      --dark: #0f172a;
      --card-bg: rgba(255, 255, 255, 0.95);
      --border-color: rgba(226, 232, 240, 0.9);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow-x: hidden;
      color: var(--text-main);
    }

    /* Ambient Glowing Spheres */
    .glow-sphere-1 {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.3) 0%, transparent 70%);
      top: -100px;
      right: -80px;
      border-radius: 50%;
      filter: blur(50px);
      animation: float 9s ease-in-out infinite alternate;
    }

    .glow-sphere-2 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.25) 0%, transparent 70%);
      bottom: -100px;
      left: -80px;
      border-radius: 50%;
      filter: blur(60px);
      animation: float 11s ease-in-out infinite alternate-reverse;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-30px, 30px) scale(1.1); }
    }

    /* Header */
    header {
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #818cf8, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-back-home {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.25s ease;
    }

    .btn-back-home:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      transform: translateX(-3px);
    }

    /* Signup Container */
    .signup-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      position: relative;
      z-index: 10;
      flex: 1;
    }

    .signup-card {
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 480px;
      padding: 38px 36px;
      backdrop-filter: blur(16px);
      animation: cardEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .signup-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .signup-icon-badge {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.15), rgba(6, 182, 212, 0.15));
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-bottom: 12px;
      border: 1px solid rgba(79, 70, 229, 0.2);
    }

    .signup-header h2 {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--dark);
      letter-spacing: -0.5px;
    }

    .signup-header p {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-top: 4px;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.83rem;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 6px;
    }

    .input-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-box i.input-icon {
      position: absolute;
      left: 15px;
      color: var(--text-muted);
      font-size: 0.95rem;
      transition: color 0.25s ease;
    }

    .input-box input {
      width: 100%;
      padding: 11px 40px 11px 42px;
      border-radius: 12px;
      border: 1.5px solid var(--border-color);
      background: #f8fafc;
      font-size: 0.92rem;
      outline: none;
      transition: all 0.25s ease;
    }

    .input-box input:focus {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
    }

    .input-box input:focus + i.input-icon {
      color: var(--primary);
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 4px;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: var(--dark);
    }

    /* Password Strength Bar */
    .password-strength {
      margin-top: 6px;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .strength-bar {
      height: 4px;
      flex: 1;
      background: #e2e8f0;
      border-radius: 4px;
      transition: background-color 0.3s ease;
    }

    .strength-text {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      min-width: 60px;
      text-align: right;
    }

    /* Terms & Agreement */
    .terms-check {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 18px 0 22px;
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .terms-check input {
      margin-top: 3px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .terms-check a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .terms-check a:hover {
      text-decoration: underline;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #ffffff;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.3);
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
    }

    /* Feedback Notification Box */
    .auth-alert {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 18px;
      text-align: center;
    }

    .alert-success {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .alert-danger {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    /* Footer Links */
    .login-footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border-color);
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .login-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      margin-left: 4px;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    .alt-links {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
      font-size: 0.8rem;
    }

    .alt-links a {
      color: #94a3b8;
      text-decoration: none;
    }

    .alt-links a:hover {
      color: var(--primary);
    }

    /* Minimal Page Footer */
    footer {
      padding: 16px;
      text-align: center;
      color: #64748b;
      font-size: 0.8rem;
      position: relative;
      z-index: 10;
    }

    footer a {
      color: #94a3b8;
      text-decoration: none;
      margin: 0 6px;
    }

    footer a:hover {
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <!-- Ambient Light Effects -->
  <div class="glow-sphere-1"></div>
  <div class="glow-sphere-2"></div>

  <!-- Header -->
  <header>
    <a href="index.html" class="brand">
      <i class="fa-solid fa-gem" style="color: #818cf8;"></i> RESUM
    </a>
    <a href="index.html" class="btn-back-home">
      <i class="fa-solid fa-arrow-left"></i> Back to Store
    </a>
  </header>

  <!-- Signup Form Card -->
  <main class="signup-container">
    <div class="signup-card">

      <div class="signup-header">
        <div class="signup-icon-badge">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h2>Create Account</h2>
        <p>Naya RESUM account banayein aur fast shopping start karein</p>
      </div>

      <!-- Feedback Alert Box -->
      <div id="authAlert" class="auth-alert"></div>

      <!-- Registration Form -->
      <form id="signupForm" onsubmit="handleSignup(event)">
        <!-- Full Name -->
        <div class="form-group">
          <label class="form-label" for="userName">Full Name</label>
          <div class="input-box">
            <input type="text" id="userName" placeholder="Apna pura naam likhein" required />
            <i class="fa-solid fa-user input-icon"></i>
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="userEmail">Email Address</label>
          <div class="input-box">
            <input type="email" id="userEmail" placeholder="name@domain.com" required />
            <i class="fa-solid fa-envelope input-icon"></i>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="userPassword">Create Password</label>
          <div class="input-box">
            <input type="password" id="userPassword" placeholder="Minimum 6 characters" oninput="checkPasswordStrength()" required />
            <i class="fa-solid fa-lock input-icon"></i>
            <i class="fa-solid fa-eye toggle-password" id="togglePassBtn1" onclick="togglePassword('userPassword', 'togglePassBtn1')"></i>
          </div>
          <!-- Live Strength Meter -->
          <div class="password-strength">
            <div class="strength-bar" id="bar1"></div>
            <div class="strength-bar" id="bar2"></div>
            <div class="strength-bar" id="bar3"></div>
            <span class="strength-text" id="strengthText"></span>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <div class="input-box">
            <input type="password" id="confirmPassword" placeholder="Wahi password dobara likhein" required />
            <i class="fa-solid fa-shield-halved input-icon"></i>
            <i class="fa-solid fa-eye toggle-password" id="togglePassBtn2" onclick="togglePassword('confirmPassword', 'togglePassBtn2')"></i>
          </div>
        </div>

        <!-- Terms Agreement -->
        <label class="terms-check">
          <input type="checkbox" id="termsCheck" required />
          <span>I agree to the <a href="contactme.html">Terms of Service</a> & <a href="product cancelation.html">Privacy Policy</a></span>
        </label>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit">
          <span>Create My Account</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <!-- Already Have an Account Links -->
      <div class="login-footer">
        Already have an account? 
        <a href="login.html">Log In</a> or <a href="singn in.html">Sign In</a>

        <div class="alt-links">
          <a href="creat account.html"><i class="fa-solid fa-id-card"></i> Alternative Setup</a>
          <span>•</span>
          <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Admin Panel</a>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer>
    &copy; 2026 RESUM Web Project. Designed with clean UI.
    <div>
      <a href="index.html">Home</a> |
      <a href="cart.html">Cart</a> |
      <a href="contactme.html">Contact Us</a>
    </div>
  </footer>

  <!-- Scripts -->
  <script>
    // Toggle Password Visibility
    function togglePassword(inputId, iconId) {
      const field = document.getElementById(inputId);
      const icon = document.getElementById(iconId);

      if (field.type === 'password') {
        field.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        field.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    // Dynamic Password Strength Meter
    function checkPasswordStrength() {
      const password = document.getElementById('userPassword').value;
      const bar1 = document.getElementById('bar1');
      const bar2 = document.getElementById('bar2');
      const bar3 = document.getElementById('bar3');
      const text = document.getElementById('strengthText');

      // Reset
      bar1.style.backgroundColor = '#e2e8f0';
      bar2.style.backgroundColor = '#e2e8f0';
      bar3.style.backgroundColor = '#e2e8f0';
      text.innerText = '';

      if (password.length === 0) return;

      if (password.length < 6) {
        bar1.style.backgroundColor = 'var(--danger)';
        text.innerText = 'Weak';
        text.style.color = 'var(--danger)';
      } else if (password.length < 10) {
        bar1.style.backgroundColor = 'var(--warning)';
        bar2.style.backgroundColor = 'var(--warning)';
        text.innerText = 'Medium';
        text.style.color = 'var(--warning)';
      } else {
        bar1.style.backgroundColor = 'var(--success)';
        bar2.style.backgroundColor = 'var(--success)';
        bar3.style.backgroundColor = 'var(--success)';
        text.innerText = 'Strong';
        text.style.color = 'var(--success)';
      }
    }

    // Signup Form Handler
    function handleSignup(e) {
      e.preventDefault();

      const pass = document.getElementById('userPassword').value;
      const confirmPass = document.getElementById('confirmPassword').value;
      const alertBox = document.getElementById('authAlert');

      // Password Match Validation
      if (pass !== confirmPass) {
        alertBox.className = 'auth-alert alert-danger';
        alertBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Passwords match nahi kar rahe hain!';
        alertBox.style.display = 'block';
        return;
      }

      // Success Display
      alertBox.className = 'auth-alert alert-success';
      alertBox.innerHTML = '<i class="fa-solid fa-circle-check"></i> Account ban gaya hai! Redirecting to login...';
      alertBox.style.display = 'block';

      // Redirect to login.html after 1.2s
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1200);
    }
  </script>
</body>
</html>
