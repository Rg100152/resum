<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — RESUM Secure Portal</title>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --secondary: #06b6d4;
      --dark: #0f172a;
      --card-bg: rgba(255, 255, 255, 0.95);
      --border-color: rgba(226, 232, 240, 0.9);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow-x: hidden;
      color: var(--text-main);
    }

    /* Ambient Lighting Background */
    .glow-sphere-1 {
      position: absolute;
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.3) 0%, transparent 70%);
      top: -100px;
      left: 10%;
      border-radius: 50%;
      filter: blur(50px);
      animation: float 9s ease-in-out infinite alternate;
    }

    .glow-sphere-2 {
      position: absolute;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.25) 0%, transparent 70%);
      bottom: -100px;
      right: 10%;
      border-radius: 50%;
      filter: blur(60px);
      animation: float 11s ease-in-out infinite alternate-reverse;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(25px, -25px) scale(1.1); }
    }

    /* Top Navigation Header */
    header {
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #818cf8, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-back-home {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.25s ease;
    }

    .btn-back-home:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      transform: translateX(-3px);
    }

    /* Center Card Container */
    .signin-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      position: relative;
      z-index: 10;
      flex: 1;
    }

    .signin-card {
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 440px;
      padding: 36px 32px;
      backdrop-filter: blur(16px);
      animation: cardEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(25px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .signin-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .signin-icon-badge {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.15), rgba(6, 182, 212, 0.15));
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-bottom: 12px;
      border: 1px solid rgba(79, 70, 229, 0.2);
    }

    .signin-header h2 {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--dark);
      letter-spacing: -0.5px;
    }

    .signin-header p {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-top: 4px;
    }

    /* Switch Tabs: Password vs OTP */
    .tab-switch {
      display: flex;
      background: #f1f5f9;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 22px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      border-radius: 9px;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 6px;
    }

    .input-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-box i.input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 0.95rem;
      transition: color 0.25s ease;
    }

    .input-box input {
      width: 100%;
      padding: 11px 40px 11px 40px;
      border-radius: 12px;
      border: 1.5px solid var(--border-color);
      background: #f8fafc;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.25s ease;
    }

    .input-box input:focus {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
    }

    .input-box input:focus + i.input-icon {
      color: var(--primary);
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 4px;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: var(--dark);
    }

    /* Options */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      font-size: 0.83rem;
    }

    .remember-check {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      color: var(--text-muted);
      user-select: none;
    }

    .remember-check input {
      cursor: pointer;
      accent-color: var(--primary);
    }

    .help-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .help-link:hover {
      text-decoration: underline;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #ffffff;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.3);
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
    }

    /* Notification Box */
    .auth-alert {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 18px;
      text-align: center;
    }

    .alert-success {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    /* Footer Links */
    .signin-footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border-color);
      font-size: 0.86rem;
      color: var(--text-muted);
    }

    .signin-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      margin-left: 4px;
    }

    .signin-footer a:hover {
      text-decoration: underline;
    }

    .alt-links {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 12px;
      font-size: 0.8rem;
    }

    .alt-links a {
      color: #94a3b8;
      text-decoration: none;
    }

    .alt-links a:hover {
      color: var(--primary);
    }

    /* Page Footer */
    footer {
      padding: 16px;
      text-align: center;
      color: #64748b;
      font-size: 0.8rem;
      position: relative;
      z-index: 10;
    }

    footer a {
      color: #94a3b8;
      text-decoration: none;
      margin: 0 6px;
    }

    footer a:hover {
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <!-- Ambient Light Spheres -->
  <div class="glow-sphere-1"></div>
  <div class="glow-sphere-2"></div>

  <!-- Header -->
  <header>
    <a href="index.html" class="brand">
      <i class="fa-solid fa-gem" style="color: #818cf8;"></i> RESUM
    </a>
    <a href="index.html" class="btn-back-home">
      <i class="fa-solid fa-arrow-left"></i> Back to Store
    </a>
  </header>

  <!-- Sign In Form Container -->
  <main class="signin-container">
    <div class="signin-card">

      <div class="signin-header">
        <div class="signin-icon-badge">
          <i class="fa-solid fa-right-to-bracket"></i>
        </div>
        <h2>Sign In</h2>
        <p>Enter your credentials to continue shopping</p>
      </div>

      <!-- Tab Switcher (Password vs OTP) -->
      <div class="tab-switch">
        <button class="tab-btn active" id="tabPassword" onclick="switchMode('password')">
          <i class="fa-solid fa-key"></i> Password
        </button>
        <button class="tab-btn" id="tabOtp" onclick="switchMode('otp')">
          <i class="fa-solid fa-mobile-screen"></i> Phone OTP
        </button>
      </div>

      <!-- Live Feedback Notification -->
      <div id="authAlert" class="auth-alert alert-success">
        <i class="fa-solid fa-circle-check"></i> Verified! Redirecting to Dashboard...
      </div>

      <!-- Sign In Form -->
      <form id="signInForm" onsubmit="handleSignIn(event)">

        <!-- Mode 1: Email / Username -->
        <div class="form-group" id="userIdentifierGroup">
          <label class="form-label" for="userLoginId">Email or Username</label>
          <div class="input-box">
            <input type="text" id="userLoginId" placeholder="name@domain.com" required />
            <i class="fa-solid fa-user-circle input-icon"></i>
          </div>
        </div>

        <!-- Mode 1: Password -->
        <div class="form-group" id="passwordGroup">
          <label class="form-label" for="userPassword">Password</label>
          <div class="input-box">
            <input type="password" id="userPassword" placeholder="••••••••" required />
            <i class="fa-solid fa-lock input-icon"></i>
            <i class="fa-solid fa-eye toggle-password" id="togglePassBtn" onclick="togglePass()"></i>
          </div>
        </div>

        <!-- Mode 2: Phone Number (Hidden by default) -->
        <div class="form-group" id="phoneGroup" style="display: none;">
          <label class="form-label" for="userPhone">Registered Phone Number</label>
          <div class="input-box">
            <input type="tel" id="userPhone" placeholder="+91 9876543210" />
            <i class="fa-solid fa-phone input-icon"></i>
          </div>
        </div>

        <!-- Options (Remember & Reset) -->
        <div class="form-options">
          <label class="remember-check">
            <input type="checkbox" id="rememberSignIn" />
            <span>Keep me signed in</span>
          </label>
          <a href="contactme.html" class="help-link">Need help?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit" id="submitBtn">
          <span>Sign In to RESUM</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <!-- Bottom Links (login.html, singnup.html, creat account.html) -->
      <div class="signin-footer">
        Don't have an account yet? 
        <a href="singnup.html">Sign Up</a> or <a href="creat account.html">Create One</a>

        <div class="alt-links">
          <a href="login.html"><i class="fa-solid fa-lock"></i> Classic Login</a>
          <span>•</span>
          <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Admin Dashboard</a>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer>
    &copy; 2026 RESUM Web Project. Designed with clean UI.
    <div>
      <a href="index.html">Home</a> |
      <a href="cart.html">Cart</a> |
      <a href="contactme.html">Support</a>
    </div>
  </footer>

  <!-- Scripts -->
  <script>
    let currentMode = 'password';

    // Switch between Password and OTP tabs
    function switchMode(mode) {
      currentMode = mode;
      const tabPass = document.getElementById('tabPassword');
      const tabOtp = document.getElementById('tabOtp');
      const userGroup = document.getElementById('userIdentifierGroup');
      const passGroup = document.getElementById('passwordGroup');
      const phoneGroup = document.getElementById('phoneGroup');
      const submitBtn = document.getElementById('submitBtn');

      if (mode === 'password') {
        tabPass.classList.add('active');
        tabOtp.classList.remove('active');
        userGroup.style.display = 'block';
        passGroup.style.display = 'block';
        phoneGroup.style.display = 'none';
        document.getElementById('userLoginId').setAttribute('required', 'true');
        document.getElementById('userPassword').setAttribute('required', 'true');
        document.getElementById('userPhone').removeAttribute('required');
        submitBtn.innerHTML = '<span>Sign In to RESUM</span> <i class="fa-solid fa-arrow-right"></i>';
      } else {
        tabOtp.classList.add('active');
        tabPass.classList.remove('active');
        userGroup.style.display = 'none';
        passGroup.style.display = 'none';
        phoneGroup.style.display = 'block';
        document.getElementById('userPhone').setAttribute('required', 'true');
        document.getElementById('userLoginId').removeAttribute('required');
        document.getElementById('userPassword').removeAttribute('required');
        submitBtn.innerHTML = '<span>Send OTP Code</span> <i class="fa-solid fa-paper-plane"></i>';
      }
    }

    // Toggle Password Visibility
    function togglePass() {
      const field = document.getElementById('userPassword');
      const icon = document.getElementById('togglePassBtn');

      if (field.type === 'password') {
        field.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        field.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    // Handle Form Submit
    function handleSignIn(e) {
      e.preventDefault();

      const alertBox = document.getElementById('authAlert');
      
      if (currentMode === 'otp') {
        alertBox.innerHTML = '<i class="fa-solid fa-circle-check"></i> OTP code sent! Auto-logging in...';
      } else {
        alertBox.innerHTML = '<i class="fa-solid fa-circle-check"></i> Signed in successfully! Redirecting...';
      }
      
      alertBox.style.display = 'block';

      // Redirect to dashboard.html after 1.2s
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1200);
    }
  </script>
</body>
</html>
